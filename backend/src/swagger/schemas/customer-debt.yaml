CustomerDebt:
  type: object
  properties:
    id:
      type: integer
    customer_id:
      type: integer
    product_id:
      type: integer
    quantity:
      type: integer
    unit_price:
      type: string
    created_at:
      type: string

CreateCustomerDebt:
  type: object
  required:
    - customer_id
    - debts
  properties:
    customer_id:
      type: integer
      example: 1
    debts:
      type: array
      items:
        type: object
        required:
          - product_id
          - quantity
        properties:
          product_id:
            type: integer
            example: 1
          quantity:
            type: integer
            example: 2
