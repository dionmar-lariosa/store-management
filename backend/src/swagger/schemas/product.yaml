Products:
  type: object
  properties:
    id:
      type: integer
    category_id:
      type: integer
      nullable: true
    category_name:
      type: string
      nullable: true
    selling_price:
      type: number
      format: float
    stock_quantity:
      type: integer
    image_url:
      type: string
      nullable: true
    is_active:
      type: boolean

Product:
  type: object
  properties:
    id:
      type: integer
    category_id:
      type: integer
      nullable: true
    category_name:
      type: string
      nullable: true
    name:
      type: string
    unit:
      type: string
    cost_price:
      type: number
      format: float
    selling_price:
      type: number
      format: float
    stock_quantity:
      type: integer
    minimum_stock:
      type: integer
    image_url:
      type: string
      nullable: true
    note:
      type: string
      nullable: true
    is_active:
      type: boolean
    created_at:
      type: string

CreateProduct:
  type: object
  required:
    - name
    - selling_price
  properties:
    category_id:
      type: integer
      nullable: true
    name:
      type: string
    unit:
      type: string
    cost_price:
      type: number
      format: float
    selling_price:
      type: number
      format: float
    stock_quantity:
      type: integer
    minimum_stock:
      type: integer
    image_url:
      type: string
      nullable: true
    note:
      type: string
      nullable: true

UpdateProduct:
  type: object
  properties:
    category_id:
      type: integer
      nullable: true
    name:
      type: string
    unit:
      type: string
    cost_price:
      type: number
      format: float
    selling_price:
      type: number
      format: float
    stock_quantity:
      type: integer
    minimum_stock:
      type: integer
    image_url:
      type: string
      nullable: true
    note:
      type: string
      nullable: true

ProductId:
  type: object
  properties:
    id:
      type: integer
      example: 1

UpdateIsActive:
  type: object
  required:
    - is_active
  properties:
    is_active:
      type: boolean
      description: Enable or disable the product.
      example: false
